name: Verify design report

on:
  push:
    branches: [design-layout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'EastC0ast/lab01' && github.ref == 'refs/heads/design-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verified dependencies
        run: python -m pip install -r requirements-verified.txt
      - name: Verify committed reports before rebuilding
        run: |
          python design/verify_report.py
          python design/handwriting/verify_study.py
          python designer_generator/verify_sprint2.py
      - name: Check statistical definitions and handwriting data
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest design.research_tests -v
          python -m unittest discover -s design/handwriting -p test_handwriting.py -v
      - name: Execute both sprints and rebuild the complete report
        env:
          MPLBACKEND: Agg
        run: |
          python design/research_revision.py --execute
          python designer_generator/build_sprint2.py
          python design/build_complete_report.py
          python design/make_reader.py --input lab01_calculations.ipynb
          python design/verify_report.py --execute
          python designer_generator/verify_sprint2.py --execute
      - name: Check source generator equivalence and marimo application
        env:
          MPLBACKEND: Agg
        run: |
          python -c "from pathlib import Path; from designer_generator.verify import inspect_export; print(inspect_export(Path('designer_generator/preview.html')))"
          python -m designer_generator.verify
          python -m designer_generator.browser_verify
      - name: Verify raw data and historical source remain untouched
        run: git diff --exit-code -- ASE10.csv design/notebook_source.json.gz.b64 designer_generator/original_generators.py
