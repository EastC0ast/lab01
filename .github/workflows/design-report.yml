name: Build design report

on:
  push:
    branches: [design-layout]
    paths:
      - 'design/notebook_source.json.gz.b64'
      - 'design/build_report.py'
      - 'requirements-design.txt'
      - '.github/workflows/design-report.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'EastC0ast/lab01' && github.ref == 'refs/heads/design-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design-layout
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify presentation source integrity
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('design/notebook_source.json.gz.b64').read_text().strip()
          decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '77cfea26416862e15852103b31a2fa2e13441cda7ec06702217b1a375953c602'
          assert hashlib.sha256(decoded).hexdigest() == expected, 'Presentation source checksum mismatch'
          print('Presentation source matches the prepared notebook.')
          PY
      - name: Keep Markdown text outside code toggles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('design/build_report.py')
          text = path.read_text()
          old = "soup.select('.jp-InputArea')"
          new = "soup.select('.jp-CodeCell .jp-InputArea')"
          if old in text:
              assert text.count(old) == 1
              path.write_text(text.replace(old, new))
          else:
              assert new in text, 'Unexpected reader implementation'
          PY
      - name: Install notebook dependencies
        run: python -m pip install -r requirements-design.txt
      - name: Execute, verify and export the report
        env:
          MPLBACKEND: Agg
        run: |
          python design/build_report.py
          python - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          checks = json.loads(Path('checks/render_verification.json').read_text())
          assert checks['html_code_panels'] == checks['code_cells_hidden'] == 22
          html = BeautifulSoup(Path('lab01_reading.html').read_text(), 'html.parser')
          assert not html.select('.jp-MarkdownCell details.lab-code'), 'Report text must remain visible'
          assert not html.select('details.lab-code[open]'), 'Code must be collapsed by default'
          assert html.select_one('#contents') is not None
          assert html.select_one('#top') is not None
          print('Reader verified: all prose visible, 22 code panels collapsed.')
          PY
      - name: Commit rendered results to design-layout only
        run: |
          test "$(git branch --show-current)" = "design-layout"
          git add lab01.ipynb lab01_reading.html DESIGN_README.md design/style_layer.py design/report.css design/build_report.py checks/render_verification.json
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: publish verified notebook and reader with visible text'
          git push origin HEAD:refs/heads/design-layout
